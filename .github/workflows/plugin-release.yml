name: One-Click Publish plugin release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  validate:
    name: Validate plugin artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install locked dependencies
        run: npm ci

      - name: Build plugin artifact
        run: npm run build:plugin

      - name: Generate and validate distribution mirrors
        run: |
          npm run package:plugin
          npm run check:plugin
          git diff --exit-code -- manifest.json main.js plugin/manifest.json plugin/main.js package.json

      - name: Check runtime syntax
        run: node --check plugin/main.js

      - name: Run tests
        run: npm test

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install locked dependencies
        run: npm ci

      - name: Build and stage release assets
        run: |
          npm run build:plugin
          npm run package:plugin
          npm run check:plugin
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('plugin/manifest.json', 'utf8')).version)")
          test "$VERSION" = "$GITHUB_REF_NAME"

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: dist/obsidian-release/*

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist/obsidian-release/manifest.json dist/obsidian-release/main.js)
          if [ -f dist/obsidian-release/styles.css ]; then
            assets+=(dist/obsidian-release/styles.css)
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --title "$GITHUB_REF_NAME" --generate-notes
